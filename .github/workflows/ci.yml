name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test on Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        if: matrix.node-version != 26
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/setup-node@v7
        if: matrix.node-version == 26
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm outdated
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm type-check:dist
      - name: Upload coverage to Codecov
        if: matrix.node-version == 26
        uses: codecov/codecov-action@v7
        with:
          files: tests/coverage/coverage-final.json

  bench:
    name: Benchmark regression check
    runs-on: ubuntu-latest
    # Non-blocking: tests/benchmarks/baseline.json is per-machine; compare.ts downgrades to warnings when the
    # baseline was recorded elsewhere, and hosted runners are noisy, hence the loose tolerance.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:ci --tolerance 0.5

  windows:
    name: Windows (Tier 2, non-blocking)
    runs-on: windows-latest
    # Tier 2 canary: failures here never block a merge (see README "Platform Support").
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run tests/watchr.integration.test.ts tests/regressions/event-ordering.test.ts tests/regressions/root-lifecycle.test.ts tests/regressions/listener-safety.test.ts tests/regressions/global-pollution.test.ts
