name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 26 bundles npm >= 11.19, which already satisfies the >= 11.5.1 requirement for OIDC trusted publishing.
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.0
      - run: pnpm audit --prod
      - id: version
        name: Determine release version
        shell: bash
        run: |
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0)"
          if ! git log "$latest_tag..HEAD" --format='%s%n%b' | grep -Eq '^[a-z-]+(\([^)]*\))?!:|^(feat|fix|perf|revert)(\([^)]*\))?:|BREAKING[- ]CHANGE:'; then
            echo "No version bump required."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump_log="$(mktemp)"
          if ! version="$(git cliff --github-repo "$GITHUB_REPOSITORY" --bumped-version 2>"$bump_log")"; then
            cat "$bump_log" >&2
            if grep -q "There is nothing to bump" "$bump_log"; then
              echo "No version bump required."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          cat "$bump_log" >&2
          version="${version#v}"
          if [[ -z "$version" ]]; then
            echo "No commits since the latest release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json')).version")"
          if [[ "$version" == "$current" ]]; then
            echo "No release-worthy commits since the latest tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Generate changelog and update version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git cliff --github-repo "$GITHUB_REPOSITORY" --tag "v$VERSION" --unreleased --strip header --output release-notes.md
          git cliff --github-repo "$GITHUB_REPOSITORY" --tag "v$VERSION" --output CHANGELOG.md
          npm version "$VERSION" --no-git-tag-version
      - name: Validate and pack
        id: package
        if: steps.version.outputs.skip != 'true'
        run: |
          pnpm lint
          pnpm type-check
          pnpm test
          pnpm build --minify
          pnpm pack
          shopt -s nullglob
          packages=(d1g1tal-watchr-*.tgz)
          test "${#packages[@]}" -eq 1
          js_count="$(tar tzf "${packages[0]}" | grep -cE '\.js$')"
          test "$js_count" -eq 1
          echo "tarball=${packages[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        run: pnpm publish --no-git-checks --provenance
      - name: Commit version, tag, and push
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag -a "$tag" -m "$tag"
          git push origin HEAD:main --follow-tags
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release-notes.md "$TARBALL"
